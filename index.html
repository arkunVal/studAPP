<title>Studium-App</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: schwebende Glas-Navbar (Desktop) / Pill-Tabbar mit rotem Glow (Handy), Dashboard aus Glas-Karten + Kalender-Spalte rechts */
:root{
  --bg:#0c0a0e; --card:rgba(255,255,255,.055); --card-solid:#17141b; --line:rgba(255,255,255,.09);
  --fg:#f4f1f5; --muted:#a8a1ae; --dim:#6f6877;
  --accent:#ff6b2c; --accent-fg:#1a0b03; --red:#ff3b30;
  --good:#35d08a; --warn:#ffb020; --bad:#ff5a52;
  --glass:rgba(26,21,30,.66); --glow1:rgba(255,90,40,.17); --glow2:rgba(120,90,255,.10);
  --tab:#1c191f; --field:rgba(255,255,255,.06); --shadow:0 18px 50px rgba(0,0,0,.45);
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#e8ecf6; --card:#ffffff; --card-solid:#ffffff; --line:rgba(20,20,40,.09);
  --fg:#17151c; --muted:#5d5968; --dim:#8c8896;
  --accent:#d9480f; --accent-fg:#ffffff; --red:#e5322a;
  --good:#12875a; --warn:#b86e00; --bad:#d4342c;
  --glass:rgba(255,255,255,.72); --glow1:rgba(255,120,60,.18); --glow2:rgba(110,130,255,.18);
  --tab:#1c191f; --field:rgba(20,20,40,.05); --shadow:0 14px 40px rgba(40,50,90,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--glow1),transparent 70%),radial-gradient(700px 500px at 100% 40%,var(--glow2),transparent 70%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;text-transform:none}

/* Navbar */
.navwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-top:12px}
.nav{display:flex;align-items:center;gap:12px;height:58px;padding:0 12px 0 18px;border-radius:18px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),var(--shadow)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo i{display:flex;align-items:flex-end;gap:3px;height:20px}
.logo i b{display:block;width:4px;border-radius:2px;background:var(--accent)}
.logo i b:nth-child(1){height:11px}.logo i b:nth-child(2){height:20px;background:var(--red)}.logo i b:nth-child(3){height:15px}
.links{display:flex;gap:2px;margin:0 auto;padding:0}
.links button{background:none;border:0;padding:8px 14px;border-radius:11px;color:var(--muted);font-weight:500}
.links button:hover{color:var(--fg);background:var(--field)}
.links button[aria-current="page"]{color:var(--fg);background:var(--field);box-shadow:inset 0 -2px 0 var(--accent)}
.nav-r{display:flex;align-items:center;gap:6px}
.ibtn{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;border:0;background:none;color:var(--muted)}
.ibtn:hover{color:var(--fg);background:var(--field)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 8px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync[data-s="sync"]::before{background:var(--good)}.sync[data-s="speichert"]::before{background:var(--warn)}.sync[data-s="fehler"]::before{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--field);font-weight:600}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 25%,transparent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.semsel{background:var(--field);border:1px solid var(--line);border-radius:11px;height:38px;padding:0 10px;max-width:190px}
.semsel option{background:var(--card-solid);color:var(--fg)}

main{padding-top:22px;min-height:70vh}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:var(--f-disp);font-size:clamp(34px,5vw,48px);line-height:1;font-weight:700}
.ph p{margin:6px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:18px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--muted)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
:root:not([data-theme="light"]) .card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{display:flex;flex-direction:column;gap:2px;min-height:132px}
.stat .k{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.stat .v{font-family:var(--f-disp);font-size:38px;font-weight:700;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.stat .viz{margin-top:auto;padding-top:8px}
.bars{display:flex;align-items:flex-end;gap:5px;height:30px}
.bars b{flex:1;border-radius:3px;background:var(--accent);min-height:4px;max-width:14px}
.bars b.d{background:var(--line)}
.prog{height:6px;border-radius:4px;background:var(--field);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.feature{background:linear-gradient(150deg,#ff7a33,#e5421f);color:#1a0b03;border:0;display:flex;flex-direction:column;gap:6px;justify-content:space-between;min-height:220px}
.feature .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.feature .big{font-family:var(--f-disp);font-size:34px;font-weight:700;line-height:1.05}
.feature .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:600}
.feature .meta span{display:flex;align-items:center;gap:6px}
.feature .ic{width:17px;height:17px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:var(--field);border:1px solid transparent;width:100%;text-align:left;min-width:0}
button.item:hover{border-color:var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--field);color:var(--muted);white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.empty{color:var(--muted);padding:18px 6px;text-align:center}
.remind{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:13px;background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b-open{fill:var(--accent)}.chart .b-done{fill:var(--good)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--accent)}
.legend span.g::before{background:var(--good)}

/* Kalender */
.cal{width:100%}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.cal-g .w{color:var(--dim);font-size:11px;padding:4px 0}
.cal-g .d{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.cal-g .d.o{opacity:.35}
.cal-g .d.t{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cal-g .d.f::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.cal-g .d.t.f::after{background:var(--accent-fg)}

/* Stundenplan */
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.weekbar .wk{font-weight:700;min-width:150px;text-align:center}
.grid{display:grid;grid-template-columns:48px repeat(var(--cols),minmax(0,1fr));gap:0 8px}
.grid .hd{padding:6px 4px 10px;text-align:center;font-weight:700}
.grid .hd small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.grid .hd.today{color:var(--accent)}
.hours{position:relative}
.hours span{position:absolute;right:6px;font-size:11px;color:var(--dim);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.dcol{position:relative;border-left:1px solid var(--line)}
.dcol .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.blk{position:absolute;left:4px;right:4px;border-radius:12px;padding:7px 9px;overflow:hidden;text-align:left;border:0;color:#14100f;font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;gap:1px}
.blk b{font-size:13px}
.blk.bi::after{content:"2-wöchig";position:absolute;right:7px;top:7px;font-size:10px;font-weight:700;opacity:.7}
.blk.now{box-shadow:0 0 0 2px var(--fg)}
.daylist{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs button{flex:none;min-width:54px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);text-align:center;font-weight:600}
.tabs button small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.tabs button[aria-pressed="true"] small{color:inherit;opacity:.8}

/* Abgaben + Wissen + Module */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--field);color:var(--muted);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.trow .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--dim);background:none;display:grid;place-items:center;color:transparent;padding:0}
.trow .chk .ic{width:15px;height:15px;stroke-width:3}
.trow.done .chk{background:var(--good);border-color:var(--good);color:#06150e}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow .tt{font-weight:600}
.trow .ts{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.trow .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.fcard{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;padding:14px}
.fcard:hover{border-color:color-mix(in srgb,var(--fg) 25%,transparent)}
.ftype{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.04em;color:#14100f}
.fcard .t{font-weight:700;overflow-wrap:anywhere}
.fcard .n{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{height:38px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard .bar{height:6px;border-radius:4px}
.mcard h3{margin:0;font-size:17px}
.mcard .row{display:flex;gap:8px;flex-wrap:wrap}

/* Formulare */
.fi{width:100%;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-height:40px}
.fi option{background:var(--card-solid);color:var(--fg)}
textarea.fi{min-height:90px;resize:vertical}
.fl{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatches input:checked+span{border-color:var(--fg)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* Dialog */
#modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(5,4,8,.62);backdrop-filter:blur(4px)}
.sheet{width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;background:var(--card-solid);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.sheet.wide{width:min(780px,100%)}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-h h2{font-family:var(--f-disp);font-size:28px}
#mform{display:grid;gap:14px}
.sh-f{display:flex;gap:8px;align-items:center;margin-top:4px}
.sp{flex:1}
.preview{border-radius:14px;overflow:hidden;background:var(--field);border:1px solid var(--line)}
.preview img{display:block;width:100%;max-height:60vh;object-fit:contain}
.preview iframe{display:block;width:100%;height:62vh;border:0;background:#fff}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow)}

/* Tabbar (Handy) */
.mbar,.tabbar{display:none}
@media (max-width:859px){
  .nav .links,.nav .sync,.nav .btn.pri,.nav .semsel{display:none}
  .nav{height:52px;padding:0 8px 0 14px}
  .nav .logo{margin-right:auto}
  .mbar{display:flex;align-items:center;gap:8px;margin-top:10px}
  .mbar .semsel{flex:1;max-width:none}
  main{padding-top:16px}
  body{padding-bottom:120px}
  .tabbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:55;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none}
  .tabbar nav{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:62px;border-radius:26px;background:var(--tab);box-shadow:0 14px 34px rgba(0,0,0,.4);overflow:hidden}
  .tabbar button{position:relative;background:none;border:0;color:#8f8996;display:grid;place-items:center;padding:0}
  .tabbar button .ic{width:25px;height:25px}
  .tabbar button[aria-current="page"]{color:var(--red)}
  .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:0 0 6px 6px;background:var(--red);box-shadow:0 0 14px var(--red)}
  .tabbar button[aria-current="page"]::after{content:"";position:absolute;top:5px;left:50%;width:64px;height:48px;margin-left:-32px;background:linear-gradient(to bottom,rgba(255,59,48,.34),transparent);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);pointer-events:none}
  .tabbar button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .dash,.two{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{display:none}
  .daylist{display:block}
  .trow{grid-template-columns:auto minmax(0,1fr)}
  .trow .right{grid-column:1/-1;justify-content:flex-start}
  .frow{grid-template-columns:minmax(0,1fr)}
  .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:860px) and (max-width:1139px){
  .dash{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="navwrap">
    <header class="nav">
      <div class="logo"><i aria-hidden="true"><b></b><b></b><b></b></i>Studium</div>
      <nav class="links" id="links" aria-label="Hauptnavigation"></nav>
      <div class="nav-r">
        <span class="sync" id="sync" data-s="lokal">Nur lokal</span>
        <select class="semsel" id="semsel" aria-label="Semester"></select>
        <button class="ibtn" id="bsearch" aria-label="Wissen durchsuchen"></button>
        <button class="ibtn" id="btheme" aria-label="Hell oder dunkel umschalten"></button>
        <button class="btn pri" id="bnew"></button>
      </div>
    </header>
    <div class="mbar"><select class="semsel" id="semsel2" aria-label="Semester"></select><span class="sync" id="sync2" data-s="lokal">Nur lokal</span></div>
  </div>
  <main id="view"></main>
</div>
<div class="tabbar"><nav id="tabs" aria-label="Navigation"></nav></div>
<div id="modal" hidden></div>

<script>
(function(){

function queueSave(){
  if(!docRef)return;
  setSync('speichert');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  if(writing){queueSave();return;}
  writing=true;
  Promise.resolve().then(function(){return docRef.set(JSON.parse(JSON.stringify(S)));})
   .then(function(){setSync('sync');})
   .catch(function(){setSync('fehler');})
   .then(function(){writing=false;});
}
function setSync(s){
  syncState=s;

  ['sync','sync2'].forEach(function(id){var e=$('#'+id);if(e){e.dataset.s=s;e.textContent=t;}});
}

/* ---------- Abfragen ---------- */
function mods(){return S.modules.filter(function(m){return m.sem===S.semId;});}
function modById(id){return S.modules.filter(function(m){return m.id===id;})[0];}
function modIds(){return mods().map(function(m){return m.id;});}
function slots(){var ids=modIds();return S.slots.filter(function(s){return ids.indexOf(s.mod)>-1;});}
function tasks(){var ids=modIds();return S.tasks.filter(function(t){return ids.indexOf(t.mod)>-1;});}
function files(){var ids=modIds();return S.files.filter(function(f){return !f.mod||ids.indexOf(f.mod)>-1;});}
function isOpen(t){return t.status==='offen'||t.status==='in Arbeit';}
function slotsOn(date){
  var wk=isoWeek(date),day=(date.getDay()+6)%7;
  return slots().filter(function(s){return s.day===day&&(!s.bi||s.par===wk%2);}).sort(function(a,b){return toMin(a.start)-toMin(b.start);});
}
function byDue(a,b){return new Date(a.due)-new Date(b.due);}
function slotLabel(s){var m=modById(s.mod);return (m?m.short:'?')+' · '+s.type;}
function countdown(due){
  var n=dayDiff(new Date(due),new Date());
  if(n<0)return {t:'überfällig ('+(-n)+' T.)',c:'bad'};
  if(n===0)return {t:'heute',c:'bad'};
  if(n===1)return {t:'morgen',c:'warn'};
  return {t:'in '+n+' Tagen',c:n<=3?'warn':''};
}

  var ratio=all.length?doneN/all.length:0, L=Math.PI*36;

function chart(all){
  var m0=monday(new Date()), W=8, cnt=[];
  for(var i=0;i<W;i++){cnt.push({o:0,d:0});}
  all.forEach(function(t){var w=Math.floor(dayDiff(new Date(t.due),m0)/7);if(w>=0&&w<W){if(isOpen(t))cnt[w].o++;else cnt[w].d++;}});
  var mx=3;cnt.forEach(function(c){mx=Math.max(mx,c.o+c.d);});
  var vw=520,vh=190,pl=26,pb=24,pt=10,iw=vw-pl-6,ih=vh-pb-pt,bw=iw/W,s='';
  for(var k=0;k<=mx;k++){var y=pt+ih-ih*k/mx;s+='<line class="gl" x1="'+pl+'" x2="'+(vw-6)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+k+'</text>';}
  cnt.forEach(function(c,i){
    var x=pl+i*bw+bw*.22,w=bw*.56,hO=ih*c.o/mx,hD=ih*c.d/mx;
    if(c.o)s+='<rect class="b-open" x="'+x+'" y="'+(pt+ih-hO)+'" width="'+w+'" height="'+hO+'" rx="4"/>';
    if(c.d)s+='<rect class="b-done" x="'+x+'" y="'+(pt+ih-hO-hD)+'" width="'+w+'" height="'+hD+'" rx="4"/>';
    s+='<text x="'+(x+w/2)+'" y="'+(vh-6)+'" text-anchor="middle">KW '+isoWeek(addDays(m0,i*7))+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+vw+' '+vh+'" role="img" aria-label="Anzahl der Abgabefristen pro Kalenderwoche">'+s+'</svg>';
}

function calendar(all){
  var now=new Date();if(!calM)calM=new Date(now.getFullYear(),now.getMonth(),1);
  var first=calM,start=monday(first),cells='',fr={};
  all.forEach(function(t){if(isOpen(t)){var d=new Date(t.due);fr[d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()]=1;}});
  for(var i=0;i<42;i++){var d=addDays(start,i);if(i>=35&&d.getMonth()!==first.getMonth())break;
    var cl='d'+(d.getMonth()!==first.getMonth()?' o':'')+(dayDiff(d,now)===0?' t':'')+(fr[d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()]?' f':'');
    cells+='<div class="'+cl+'">'+d.getDate()+'</div>';}
  return '<div class="cal"><div class="cal-h"><button class="ibtn" data-act="calprev" aria-label="Vorheriger Monat">'+ic('left')+'</button><span>'+first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})+'</span><button class="ibtn" data-act="calnext" aria-label="Nächster Monat">'+ic('right')+'</button></div><div class="cal-g">'+DS.concat(['So']).map(function(x){return '<div class="w">'+x+'</div>';}).join('')+cells+'</div><div class="hint" style="margin-top:10px"><span style="color:var(--red)">●</span> Abgabefrist</div></div>';
}

function vPlan(){

  var lo=8,hi=18;ss.forEach(function(s){lo=Math.min(lo,Math.floor(toMin(s.start)/60));hi=Math.max(hi,Math.ceil(toMin(s.end)/60));});
  var PX=54, H=(hi-lo)*PX;

    var date=addDays(mon,d),today=dayDiff(date,now)===0;

    var blocks=slotsOn(date).map(function(s){var m=modById(s.mod),top=(toMin(s.start)-lo*60)/60*PX,hh=(toMin(s.end)-toMin(s.start))/60*PX;

    body+='<div class="dcol" style="height:'+H+'px">'+lines+blocks+'</div>';
  }
  var grid='<div class="grid" style="--cols:'+cols+'">'+head+'<div class="hours" style="height:'+H+'px">'+hrs+'</div>'+body+'</div>';
  // Handy: Tagesliste
  if(planDay>=cols)planDay=0;

  var C=window.SUPABASE_CONFIG;
  if(!C||!C.url||!C.anonKey||!window.supabase)return;
  var sb=window.supabase.createClient(C.url,C.anonKey),B='studium-files',cur=null,chan=null;
  function errText(x){var m=(x&&x.message)||'';
    if(/Invalid login/i.test(m))return 'E-Mail oder Passwort falsch.';
    if(/already registered/i.test(m))return 'Konto existiert schon – bitte anmelden.';
    if(/at least/i.test(m))return 'Passwort zu kurz (mind. 6 Zeichen).';
    if(/not confirmed/i.test(m))return 'E-Mail noch nicht bestätigt – bitte den Link in der Mail anklicken.';
    return m||'Fehler';}
  function closeAuth(){var o=document.getElementById('authov');if(o)o.remove();}
  function authUI(msg){
    var o=document.getElementById('authov');
    if(!o){o=document.createElement('div');o.id='authov';o.style.cssText='position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:16px';document.body.appendChild(o);}
    o.innerHTML='<form class="card" style="width:min(360px,100%);padding:22px;display:grid;gap:12px;background:var(--card-solid)"><h2 class="disp" style="font-size:30px">Anmelden</h2><p class="hint" style="margin:0">Damit sind deine Daten auf allen Geräten synchron.</p><input class="fi" name="e" type="email" placeholder="E-Mail" autocomplete="email" required><input class="fi" name="p" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="current-password" required><div class="hint" style="color:var(--warn)">'+(msg||'')+'</div><div style="display:flex;gap:8px"><button class="btn pri" data-m="in" style="flex:1">Anmelden</button><button class="btn" data-m="up">Registrieren</button></div><button class="btn ghost sm" type="button" id="authskip">Nur lokal nutzen</button></form>';
    o.querySelector('form').onsubmit=function(ev){ev.preventDefault();var f=ev.target,m=ev.submitter&&ev.submitter.dataset.m,e=f.e.value.trim(),p=f.p.value;
      var q=m==='up'?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p});
      q.then(function(r){if(r.error)authUI(errText(r.error));else if(m==='up'&&!r.data.session)authUI('Bestätigungs-Mail verschickt – Link anklicken, dann anmelden.');});};
    o.querySelector('#authskip').onclick=function(){closeAuth();setSync('lokal');};
  }
  ['sync','sync2'].forEach(function(id){var el=document.getElementById(id);if(!el)return;el.style.cursor='pointer';
    el.addEventListener('click',function(){if(cur){if(confirm('Abmelden? Die Daten bleiben in der Cloud.'))sb.auth.signOut();}else authUI();});});
  function apply(d){
    if(d.semesters&&(d.updated||0)>(S.updated||0)){
      S=JSON.parse(JSON.stringify(d));
      try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
      if(!S.semesters.some(function(s){return s.id===S.semId;}))S.semId=S.semesters[0].id;
      paintNav();render();setSync('sync');
    }else if((d.updated||0)<(S.updated||0))queueSave();else setSync('sync');
  }
  function pull(){
    if(!cur)return;
    sb.from('studium_data').select('data').eq('user_id',cur.id).maybeSingle().then(function(r){
      if(r.error){setSync('fehler');return;}
      if(r.data&&r.data.data)apply(r.data.data);else flush();});
  }
  function start(user){
    cur=user;
    assets={
      upload:function(file){var p=user.id+'/'+uid()+'-'+file.name.replace(/[^\w.\-]/g,'_');
        return sb.storage.from(B).upload(p,file,{contentType:file.type||'application/octet-stream'})
          .then(function(r){if(r.error)throw r.error;return sb.storage.from(B).createSignedUrl(p,315360000);})
          .then(function(r){if(r.error)throw r.error;return {id:p,contentType:file.type,url:r.data.signedUrl};});},
      'delete':function(id){return sb.storage.from(B).remove([id]);}};
    docRef={set:function(o){return sb.from('studium_data').upsert({user_id:user.id,data:o,updated_at:new Date().toISOString()}).then(function(r){if(r.error)throw r.error;});}};
    pull();
    chan=sb.channel('studium-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'studium_data',filter:'user_id=eq.'+user.id},function(p){if(p.new&&p.new.data)apply(p.new.data);}).subscribe();
  }
  function stop(){if(chan){sb.removeChannel(chan);chan=null;}cur=null;docRef=null;assets=null;setSync('lokal');}
  sb.auth.onAuthStateChange(function(ev,session){
    var u=session&&session.user;
    setTimeout(function(){
      if(u&&(!cur||cur.id!==u.id)){closeAuth();start(u);}
      else if(!u){stop();authUI();}
    },0);
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});
})();
})();
</script>

</body></html>
